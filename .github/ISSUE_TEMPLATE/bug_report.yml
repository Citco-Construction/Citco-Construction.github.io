name: Bug report
description: Report a problem with the site
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: false
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: false
  - type: input
    id: url
    attributes:
      label: Page URL
      placeholder: https://citcoconstruction.com/...
    validations:
      required: false
  - type: input
    id: environment
    attributes:
      label: Browser / device
      placeholder: e.g. Safari on iPhone 15, Chrome on Windows
    validations:
      required: false
